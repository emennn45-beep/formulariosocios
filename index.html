<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Nuevos Socios - Persos United</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background: #f8f9fa;
        }
        h1 { text-align: center; color: #333; }
        label { display: block; margin: 12px 0 5px; font-weight: bold; }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #218838; }
        .checkbox { margin: 15px 0; }
        #mensaje {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            border-radius: 4px;
        }
        .exito { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Inscripción de Nuevos Socios</h1>

    <form id="form-inscripcion">
        <label>Nombre:</label>
        <input type="text" id="nombre" required>

        <label>Apellido:</label>
        <input type="text" id="apellido" required>

        <label>DNI:</label>
        <input type="text" id="dni" required>

        <label>Teléfono / WhatsApp:</label>
        <input type="tel" id="telefono" required>

        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Fecha de nacimiento (opcional):</label>
        <input type="date" id="fecha_nacimiento">

        <label>Domicilio (opcional):</label>
        <input type="text" id="domicilio">

        <div class="checkbox">
            <label>
                <input type="checkbox" id="acepto" required>
                Acepto los términos y condiciones del club.
            </label>
        </div>

        <button type="submit">Enviar Inscripción</button>
    </form>

    <div id="mensaje"></div>

    <script>
        // 🔗 CONEXIÓN REAL A SUPABASE
        const supabaseUrl = 'https://sacnwhuuuogjvgvxqdky.supabase.co';
        const supabaseKey = 'sb_publishable_FqkvHSOJk8YN2mgh-UmLew_a3y4q8xB';

        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const form = document.getElementById('form-inscripcion');
        const mensaje = document.getElementById('mensaje');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            mensaje.textContent = '';
            mensaje.className = '';

            const data = {
                nombre: document.getElementById('nombre').value.trim(),
                apellido: document.getElementById('apellido').value.trim(),
                dni: document.getElementById('dni').value.trim(),
                telefono: document.getElementById('telefono').value.trim(),
                email: document.getElementById('email').value.trim(),
                fecha_nacimiento: document.getElementById('fecha_nacimiento').value || null,
                domicilio: document.getElementById('domicilio').value.trim() || null,
            };

            try {
                const { error } = await supabase
                    .from('inscripciones')
                    .insert([data]);

                if (error) throw error;

                mensaje.textContent = `¡INSCRIPCIÓN EXITOSA! Gracias, ${data.nombre} ${data.apellido}. Haz el aporte único y al terminar cuando se confirme el pago no quites la pantalla y serás redirigido a la web de entrada a la comunidad de socios Persos United.`;
                mensaje.className = 'exito';
                form.reset();
            } catch (err) {
                console.error(err);
                mensaje.textContent = 'Error al guardar: ' + (err.message || 'Intenta de nuevo más tarde');
                mensaje.className = 'error';
            }
        });
    </script>
</body>
</html>

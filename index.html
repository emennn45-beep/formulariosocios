<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscripción</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;

    background-image: url("https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/fondosocioformulario.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

#formulario {
    background: rgba(0,0,0,0.55);
    padding: 25px;
    border-radius: 12px;
}

/* LABELS */
label {
    display: block;
    margin-top: 14px;
    color: white;
    font-weight: bold;
}

/* INPUTS */
input {
    width: 100%;
    padding: 11px;
    margin-top: 6px;

    background: rgba(0,0,0,0.4);
    border: 1px solid white;
    border-radius: 6px;

    color: white;
    font-size: 15px;
    box-sizing: border-box;
}

input::placeholder {
    color: rgba(255,255,255,0.7);
}

input:focus {
    outline: none;
}

/* CHECKBOX */
.checkbox {
    margin-top: 18px;
    color: white;
    font-size: 14px;
}

input[type="checkbox"] {
    appearance: none;
    width: 18px;
    height: 18px;
    border: 2px solid white;
    background: transparent;
    margin-right: 8px;
    vertical-align: middle;
}

input[type="checkbox"]:checked {
    background: white;
}

/* BOTON */
button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;

    background: white;
    color: black;

    border: none;
    border-radius: 8px;

    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#mensaje {
    text-align: center;
    margin-top: 15px;
    color: white;
}

/* EXITO */
#exito {
    display: none;
    text-align: center;
    color: white;
}

/* RESPONSIVE */
@media (max-width:480px){
    #formulario {
        padding:18px;
    }

    input {
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="container">

<div id="formulario">

<form id="form-inscripcion">

<label>Nombre</label>
<input type="text" id="nombre" required>

<label>Apellido</label>
<input type="text" id="apellido" required>

<label>DNI</label>
<input type="text" id="dni" required>

<label>Teléfono / WhatsApp</label>
<input type="tel" id="telefono" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Fecha de nacimiento (opcional)</label>
<input type="date" id="fecha_nacimiento">

<label>Domicilio (opcional)</label>
<input type="text" id="domicilio">

<div class="checkbox">
<label>
<input type="checkbox" id="acepto" required>
Acepto los términos y condiciones del club.
</label>
</div>

<button type="submit">Enviar Inscripción</button>

</form>

<div id="mensaje"></div>

</div>

<div id="exito">
<h2>¡Inscripción Exitosa!</h2>
<p>Ahora haz el aporte único desde acá:</p>
<button onclick="window.location.href='https://tupagina-de-aporte.com'">Hacer Aporte</button>
<p>No cierres la pantalla. Serás redirigido automáticamente.</p>
</div>

</div>

<script>
const supabaseUrl = 'https://sacnwhuuuogjvgvxqdky.supabase.co';
const supabaseKey = 'sb_publishable_FqkvHSOJk8YN2mgh-UmLew_a3y4q8xB';
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

const form = document.getElementById('form-inscripcion');
const mensaje = document.getElementById('mensaje');
const exito = document.getElementById('exito');
const formulario = document.getElementById('formulario');

form.addEventListener('submit', async (e) => {
e.preventDefault();
mensaje.textContent = '';

const data = {
nombre: nombre.value.trim(),
apellido: apellido.value.trim(),
dni: dni.value.trim(),
telefono: telefono.value.trim(),
email: email.value.trim(),
fecha_nacimiento: fecha_nacimiento.value || null,
domicilio: domicilio.value.trim() || null
};

try {
const { error } = await supabaseClient.from('inscripciones').insert([data]);
if (error) throw error;

formulario.style.display = 'none';
exito.style.display = 'block';

} catch (err) {
mensaje.textContent = 'Error al guardar';
}
});
</script>

</body>
</html>

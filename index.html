<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscripción</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
min-height:100%;
}

body{
font-family:Arial, sans-serif;
background:url("fondosocioformulario.png") center center no-repeat;
background-size:cover;

display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

/* CONTENEDOR */
.container{
width:100%;
max-width:420px;
}

/* TARJETA FORM */
#formulario, #exito{
background:rgba(0,0,0,.55);
backdrop-filter:blur(8px);
padding:28px;
border-radius:18px;
}

/* CAMPOS */
.field{
position:relative;
margin-bottom:20px;
}

.field input{
width:100%;
padding:14px 10px;
background:transparent;
border:none;
border-bottom:2px solid rgba(255,255,255,.8);
color:white;
font-size:16px;
}

.field label{
position:absolute;
top:50%;
left:10px;
transform:translateY(-50%);
color:rgba(255,255,255,.7);
pointer-events:none;
transition:.3s;
font-size:14px;
}

.field input:focus + label,
.field input:not(:placeholder-shown) + label{
top:-6px;
font-size:11px;
color:white;
}

.field input:focus{
outline:none;
border-bottom:2px solid white;
}

/* CHECK */
.checkbox{
margin:20px 0;
color:white;
font-size:14px;
}

.checkbox input{
appearance:none;
width:18px;
height:18px;
border:2px solid white;
background:transparent;
margin-right:8px;
vertical-align:middle;
}

.checkbox input:checked{
background:white;
}

/* BOTON */
button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
background:white;
color:black;
cursor:pointer;
}

/* MENSAJE */
#mensaje{
color:white;
text-align:center;
margin-top:10px;
}

/* EXITO */
#exito{
display:none;
color:white;
text-align:center;
}

#exito button{
margin-top:15px;
}

/* MOBILE */
@media(max-width:480px){
body{padding:10px}
.field input{font-size:14px}
}

</style>
</head>

<body>

<div class="container">

<div id="formulario">

<form id="form-inscripcion">

<div class="field">
<input id="nombre" placeholder=" " required>
<label>Nombre</label>
</div>

<div class="field">
<input id="apellido" placeholder=" " required>
<label>Apellido</label>
</div>

<div class="field">
<input id="dni" placeholder=" " required>
<label>DNI</label>
</div>

<div class="field">
<input id="telefono" placeholder=" " required>
<label>Teléfono / WhatsApp</label>
</div>

<div class="field">
<input id="email" type="email" placeholder=" " required>
<label>Email</label>
</div>

<div class="field">
<input id="fecha_nacimiento" type="date">
<label>Fecha nacimiento</label>
</div>

<div class="field">
<input id="domicilio" placeholder=" ">
<label>Domicilio</label>
</div>

<div class="checkbox">
<label>
<input type="checkbox" id="acepto" required>
Acepto los términos y condiciones del club
</label>
</div>

<button type="submit">Enviar Inscripción</button>

</form>

<div id="mensaje"></div>

</div>

<div id="exito">
<h2>¡Inscripción Exitosa!</h2>
<p>Ahora haz el aporte único desde acá:</p>
<p>No cierres la pantalla. Al confirmarse el pago serás redirigido.</p>

<button onclick="window.location.href='https://tupagina-de-aporte.com'">
Hacer Aporte
</button>
</div>

</div>

<script>

const supabaseUrl='https://sacnwhuuuogjvgvxqdky.supabase.co';
const supabaseKey='sb_publishable_FqkvHSOJk8YN2mgh-UmLew_a3y4q8xB';

const supabaseClient=supabase.createClient(supabaseUrl,supabaseKey);

const form=document.getElementById('form-inscripcion');
const mensaje=document.getElementById('mensaje');
const exito=document.getElementById('exito');
const formulario=document.getElementById('formulario');

form.addEventListener('submit',async(e)=>{
e.preventDefault();

const data={
nombre:nombre.value.trim(),
apellido:apellido.value.trim(),
dni:dni.value.trim(),
telefono:telefono.value.trim(),
email:email.value.trim(),
fecha_nacimiento:fecha_nacimiento.value||null,
domicilio:domicilio.value.trim()||null
};

try{

const{error}=await supabaseClient.from('inscripciones').insert([data]);
if(error)throw error;

formulario.style.display='none';
exito.style.display='block';

}catch(err){
mensaje.innerText="Error al guardar";
}

});

</script>

</body>
</html>
